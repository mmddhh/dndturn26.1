def repositoryRoot = rootProject.projectDir.toPath()
        .resolve('../..')
        .normalize()
        .toFile()
def sharedPropertiesFile = new File(repositoryRoot, 'gradle.properties')

if (!sharedPropertiesFile.isFile()) {
    throw new GradleException("Shared gradle.properties not found: ${sharedPropertiesFile}")
}

def sharedProperties = new Properties()
sharedPropertiesFile.withInputStream { sharedProperties.load(it) }

sharedProperties.each { key, value ->
    def name = key.toString()
    if (!project.hasProperty(name)) {
        project.ext.set(name, value.toString())
    }
}
