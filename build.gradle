group = providers.gradleProperty('mod_group_id').get()
version = providers.gradleProperty('mod_version').get()

def targetBuilds = [
        'forge-1.20.1'    : [directory: 'targets/forge-1.20.1', task: 'buildForge1201'],
        'fabric-1.20.1'   : [directory: 'targets/fabric-1.20.1', task: 'buildFabric1201'],
        'neoforge-1.21.1' : [directory: 'targets/neoforge-1.21.1', task: 'buildNeoForge1211'],
        'neoforge-26.1'   : [directory: 'targets/neoforge-26.1', task: 'buildNeoForge261']
]

def selectedTarget = providers.gradleProperty('target').orNull
def buildAllTargets = providers.gradleProperty('allTargets').map { it.toBoolean() }.orElse(false)

if (selectedTarget != null && !targetBuilds.containsKey(selectedTarget)) {
    throw new GradleException("Unknown target '${selectedTarget}'. Available targets: ${targetBuilds.keySet().join(', ')}")
}

project(':common') {
    group = rootProject.group
    version = rootProject.version
}

targetBuilds.each { targetName, targetBuild ->
    tasks.register(targetBuild.task, Exec) {
        group = 'build'
        description = "Builds ${targetName} in its independent Gradle project."
        workingDir file(targetBuild.directory)
        commandLine 'cmd', '/c', 'gradlew.bat', 'build', '--console', 'plain', '--no-daemon'
    }
}

tasks.register('build') {
    group = 'build'
    description = 'Builds common and optionally one or all independent platform targets.'
    dependsOn ':common:build'

    if (selectedTarget != null) {
        dependsOn tasks.named(targetBuilds[selectedTarget].task)
    }

    if (buildAllTargets.get()) {
        ['forge-1.20.1', 'fabric-1.20.1', 'neoforge-1.21.1'].each { targetName ->
            dependsOn tasks.named(targetBuilds[targetName].task)
        }
    }
}

