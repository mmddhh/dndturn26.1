name: Verify framework boundaries

on:
  push:
    paths:
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/build-target.ps1'
      - 'scripts/discover-targets.ps1'
      - '.github/workflows/verify-common.yml'
      - 'targets/**'
  pull_request:
    paths:
      - 'common/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - 'scripts/build-target.ps1'
      - 'scripts/discover-targets.ps1'
      - '.github/workflows/verify-common.yml'
      - 'targets/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-common-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover-targets:
    name: Discover Enabled Targets
    runs-on: windows-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Build target matrix
        id: discover
        shell: pwsh
        run: |
          $matrix = .\scripts\discover-targets.ps1
          "matrix=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

  common-tests:
    name: Common rules and compiled boundaries
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Run common unit tests
        shell: pwsh
        run: .\gradlew.bat -p common clean check --console plain --no-daemon

      - name: Upload failing common results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: common-failure
          path: common/build/test-results/

  target-builds:
    name: ${{ matrix.target }} (JDK ${{ matrix.java }})
    needs: [discover-targets, common-tests]
    runs-on: windows-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify release jar
        shell: pwsh
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: .\scripts\build-target.ps1 -Target $env:BUILD_TARGET
      - name: Run scheduled tick ownership GameTest
        if: matrix.target == 'neoforge-26.1'
        working-directory: targets/neoforge-26.1
        run: .\gradlew.bat verifyScheduledTick --console plain --no-daemon
      - name: Upload verified release jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-jdk-${{ matrix.java }}
          path: targets/${{ matrix.target }}/build/verified-release/*.jar
          if-no-files-found: error
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}-failure
          path: |
            targets/${{ matrix.target }}/build/test-results/
            targets/${{ matrix.target }}/build/boundary-gametest/logs/
            targets/${{ matrix.target }}/build/boundary-gametest/boundary-report.xml
