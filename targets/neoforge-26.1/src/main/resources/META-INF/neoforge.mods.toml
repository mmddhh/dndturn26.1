modLoader = "javafml"
loaderVersion = "[4,)"
license = "${mod_license}"

[[mixins]]
config = "dndturn.mixins.json"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = "${mod_description}"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neoforge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},26.2)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "apricityui"
type = "required"
versionRange = "[1.2.5,1.3)"
ordering = "AFTER"
side = "CLIENT"

[[dependencies.${mod_id}]]
modId = "rhino"
type = "required"
versionRange = "[2101.2.7-build.82]"
ordering = "AFTER"
side = "CLIENT"

