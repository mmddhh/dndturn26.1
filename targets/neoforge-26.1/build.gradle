plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

apply from: file('../../gradle/target-conventions/properties.gradle')

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-26.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets.main.output.dir(
        project(':common').layout.buildDirectory.dir('classes/java/main'),
        builtBy: ':common:classes'
)

// Fixtures are compiled and loaded only by the automated GameTest run.
sourceSets {
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = neoforge_261_version
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
        dndturnTests {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
    runs {
        client {
            client()
            loadedMods = [neoForge.mods.getByName(mod_id)]
            if (project.hasProperty('debug')) programArgument '-debug'
        }
        server {
            server()
            loadedMods = [neoForge.mods.getByName(mod_id)]
            programArgument '--nogui'
            if (project.hasProperty('debug')) programArgument '-debug'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('gametest-run')
            sourceSet = sourceSets.gameTest
            loadedMods = [neoForge.mods.dndturnTests]
            if (project.hasProperty('debug')) programArgument '-debug'
        }
    }
}

repositories {
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
}

dependencies {
    implementation project(':common')
    // Exact NeoForge 26.1 release, not the similarly named artifacts for other targets.
    implementation 'maven.modrinth:apricityui:wwrdhxiM' // 1.2.5
    implementation 'dev.latvian.mods:rhino:2101.2.7-build.82'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: neoforge_261_minecraft_version,
            neoforge_version: neoforge_261_version,
            neoforge_version_range: neoforge_261_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

apply from: file('../../gradle/target-conventions/publish.gradle')

tasks.named('check') { dependsOn tasks.named('gameTestClasses') }
