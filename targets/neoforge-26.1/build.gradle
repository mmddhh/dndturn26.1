plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '2.1.1'
}

apply from: file('../../gradle/target-conventions/properties.gradle')

group = mod_group_id
version = mod_version

base {
    archivesName = "${mod_name}-neoforge-26.1"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

sourceSets.main.output.dir(
        project(':common').layout.buildDirectory.dir('classes/java/main'),
        builtBy: ':common:classes'
)

// Fixtures remain outside main and are loaded only by their respective verification tasks.
sourceSets {
    test {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    gameTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
    uiTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
neoForge {
    version = neoforge_261_version
    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
        dndturnTests {
            sourceSet(sourceSets.main)
            sourceSet(sourceSets.gameTest)
        }
    }
    runs {
        client {
            client()
            if (providers.gradleProperty('localRunDirectory').isPresent())
                gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('localRunDirectory').get())
            if (providers.gradleProperty('localClientName').isPresent()) {
                programArgument '--username'
                programArgument providers.gradleProperty('localClientName').get()
            }
            if (gradle.startParameter.logLevel == LogLevel.DEBUG) programArgument '--debug'
            loadedMods = [neoForge.mods.getByName(mod_id)]
        }
        server {
            server()
            if (providers.gradleProperty('localRunDirectory').isPresent())
                gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('localRunDirectory').get())
            if (gradle.startParameter.logLevel == LogLevel.DEBUG) programArgument '--debug'
            loadedMods = [neoForge.mods.getByName(mod_id)]
            programArgument '--nogui'
        }
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('gametest-run')
            programArgument '--report'
            programArgument 'gametest-report.xml'
            if (providers.gradleProperty('gameTestSelection').isPresent()) {
                programArgument '--tests'
                programArgument providers.gradleProperty('gameTestSelection').get()
            }
            sourceSet = sourceSets.gameTest
            loadedMods = [neoForge.mods.dndturnTests]
        }
        restartGameTestServer {
            type = 'gameTestServer'
            mainClass = 'cc.sighs.dndturn.gametest.RestartTestLauncher'
            gameDirectory = layout.projectDirectory.dir(providers.gradleProperty('restartTestDirectory').getOrElse('run/restart-test'))
            sourceSet = sourceSets.gameTest
            loadedMods = [neoForge.mods.dndturnTests]
        }
        scheduledTickServer {
            type = 'gameTestServer'
            gameDirectory = layout.buildDirectory.dir('boundary-gametest')
            programArgument '--tests'
            programArgument 'dndturn:scheduled_tick_hold'
            programArgument '--report'
            programArgument 'boundary-report.xml'
            sourceSet = sourceSets.gameTest
            loadedMods = [neoForge.mods.dndturnTests]
        }
    }
}

repositories {
    mavenLocal()
    maven {
        url = 'https://maven.sighs.cc/repository/maven-snapshots/'
        content { includeGroup 'io.github.fatalitaya.combatnexus' }
    }
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
    maven {
        url = 'https://maven.latvian.dev/releases'
        content { includeGroup 'dev.latvian.mods' }
    }
    maven {
        url "https://maven.sighs.cc/repository/maven-public/"
    }
    maven {
        url = "https://lss233.littleservice.cn/repositories/minecraft/"
    }
}

// Local launch dependencies are deliberately absent from published runtime variants.
configurations {
    localRuntimeOnly {
        canBeConsumed = false
        canBeResolved = false
    }
    runtimeClasspath.extendsFrom(localRuntimeOnly)
}

def contentProjects = [project(':character-content'), project(':mob-content')]
configure(contentProjects) {
    apply plugin: 'java-library'
    group = rootProject.group
    version = rootProject.version
    java.toolchain.languageVersion = JavaLanguageVersion.of(25)
    tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
    sourceSets.main.compileClasspath += rootProject.sourceSets.main.output + rootProject.sourceSets.main.compileClasspath
    tasks.named('processResources') {
        def metadata = [mod_license: rootProject.mod_license, mod_version: rootProject.mod_version]
        inputs.properties metadata
        filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
    }
}
sourceSets.gameTest.compileClasspath += project(':mob-content').sourceSets.main.output
contentProjects.each { content ->
    dependencies.add('jarJar', dependencies.project(path: content.path))
    dependencies.add('localRuntimeOnly', dependencies.project(path: content.path))
}

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    implementation project(':common')
    implementation('io.github.fatalitaya.combatnexus:CombatNexus-neoforge-26.1.2:0.1.0-SNAPSHOT') {
        transitive = false
    }
    // Exact NeoForge 26.1 release, not the similarly named artifacts for other targets.
    implementation 'com.sighs:ApricityUI-neoforge-26.1:1.2.8'
    implementation 'dev.latvian.mods:rhino:2101.2.7-build.82'
    //implementation 'dev.latvian.mods:rhino:2101.2.7-build.82'
    // Development runs only; production compilation and published artifacts do not depend on AutoJS.
    if (providers.gradleProperty('autojs').map { it.toBoolean() }.orElse(false).get()) {
        localRuntimeOnly 'com.sighs.autojs:AutoJS-neoforge-26.1:1.0.0'
        localRuntimeOnly 'dev.latvian.mods:rhino:2101.2.7-build.82'
    }
}

tasks.named('test', Test).configure { useJUnitPlatform() }

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version: neoforge_261_minecraft_version,
            neoforge_version: neoforge_261_version,
            neoforge_version_range: neoforge_261_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties + [project: project]
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
}

apply from: file('../../gradle/target-conventions/publish.gradle')

tasks.named('check') { dependsOn tasks.named('gameTestClasses') }

tasks.register('verifyUiProjection', JavaExec) {
    dependsOn tasks.named('uiTestClasses')
    classpath = sourceSets.uiTest.runtimeClasspath
    mainClass = 'cc.sighs.dndturn.platform.client.ui.OverlayUiChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
    systemProperty 'java.awt.headless', 'true'
}
tasks.named('check') { dependsOn tasks.named('verifyUiProjection') }

tasks.register('verifyDebugDiagnostics', JavaExec) {
    dependsOn tasks.named('uiTestClasses')
    classpath = sourceSets.uiTest.runtimeClasspath
    mainClass = 'cc.sighs.dndturn.platform.diagnostics.DebugDiagnosticsChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn tasks.named('verifyDebugDiagnostics') }

tasks.register('verifyControlPolicies', JavaExec) {
    dependsOn tasks.named('uiTestClasses')
    classpath = sourceSets.uiTest.runtimeClasspath
    mainClass = 'cc.sighs.dndturn.platform.server.encounter.ControlPolicyChecks'
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(25) }
}
tasks.named('check') { dependsOn tasks.named('verifyControlPolicies') }

def boundaryReport = layout.buildDirectory.file('boundary-gametest/boundary-report.xml')
tasks.named('runGameTestServer') {
    doFirst { java.nio.file.Files.deleteIfExists(layout.buildDirectory.file('gametest-run/gametest-report.xml').get().asFile.toPath()) }
}
tasks.named('runScheduledTickServer') {
    doFirst { java.nio.file.Files.deleteIfExists(boundaryReport.get().asFile.toPath()) }
}
tasks.register('verifyScheduledTick') {
    dependsOn tasks.named('runScheduledTickServer')
    doLast {
        def document = javax.xml.parsers.DocumentBuilderFactory.newInstance().newDocumentBuilder()
            .parse(boundaryReport.get().asFile)
        def cases = document.getElementsByTagName('testcase')
        if (cases.length != 1 || cases.item(0).getAttribute('name') != 'dndturn:scheduled_tick_hold' ||
            ['failure', 'error', 'skipped'].any { document.getElementsByTagName(it).length > 0 })
            throw new GradleException("Expected one passing dndturn:scheduled_tick_hold in ${boundaryReport.get().asFile}")
    }
}

def verifyMixins = { jar, configPath ->
    def config = jar.getEntry(configPath)
    if (config == null) throw new GradleException('Missing Mixin configuration in release jar')
    def json = jar.getInputStream(config).withCloseable { new groovy.json.JsonSlurper().parse(it) }
    def registered = [] as Set
    ['mixins', 'server', 'client'].each { side ->
        (json[side] ?: []).each { name ->
            def type = json.package + '.' + name
            if (!registered.add(type) || name.startsWith('client.') && side != 'client' ||
                name.startsWith('server.') && side == 'client')
                throw new GradleException("Duplicate or misplaced Mixin under ${side}: ${type}")
        }
    }
    def compiled = [] as Set
    def reader = java.lang.classfile.ClassFile.of()
    jar.entries().each { entry ->
        if (!entry.name.endsWith('.class')) return
        def model = jar.getInputStream(entry).withCloseable { reader.parse(it.readAllBytes()) }
        def annotations = model.findAttribute(java.lang.classfile.Attributes.runtimeInvisibleAnnotations())
        if (annotations.present && annotations.get().annotations().any {
            it.className().stringValue() == 'Lorg/spongepowered/asm/mixin/Mixin;'
        }) compiled.add(model.thisClass().asInternalName().replace('/', '.'))
    }
    if (compiled.empty || compiled != registered)
        throw new GradleException("Mixin registration differs from release jar. Missing: ${compiled - registered}, unknown: ${registered - compiled}")
}

tasks.named('verifyReleaseJar') {
    def release = tasks.named('jar', Jar).flatMap { it.archiveFile }
    doLast {
        new java.util.zip.ZipFile(release.get().asFile).withCloseable { jar ->
            verifyMixins(jar, 'dndturn.mixins.json')
            def indexEntry = jar.getEntry('META-INF/jarjar/metadata.json')
            if (indexEntry == null) throw new GradleException('Missing Jar-in-Jar metadata')
            def index = jar.getInputStream(indexEntry).withCloseable { new groovy.json.JsonSlurper().parse(it) }
            contentProjects.each { provider ->
                def rows = index.jars.findAll { it.identifier.group == provider.group.toString() && it.identifier.artifact == provider.name }
                if (rows.size() != 1 || jar.getEntry(rows.first().path) == null)
                    throw new GradleException("Missing or duplicate embedded provider: ${provider.path}")
                def providerFile = provider.tasks.named('jar').get().archiveFile.get().asFile
                jar.getInputStream(jar.getEntry(rows.first().path)).withCloseable { embedded ->
                    providerFile.withInputStream { built ->
                        if (!Arrays.equals(embedded.readAllBytes(), built.readAllBytes()))
                            throw new GradleException("Embedded provider differs from built jar: ${provider.path}")
                    }
                }
                new java.util.zip.ZipFile(providerFile).withCloseable { nested ->
                    if (!nested.getEntry('META-INF/neoforge.mods.toml'))
                        throw new GradleException("Missing mod descriptor in ${provider.path}")
                    nested.entries().each { entry ->
                        if (!entry.directory && !entry.name.startsWith('META-INF/') && jar.getEntry(entry.name))
                            throw new GradleException("Provider entry duplicated in core: ${entry.name}")
                        if (entry.name.endsWith('.mixins.json')) verifyMixins(nested, entry.name)
                    }
                }
            }
        }
    }
}
